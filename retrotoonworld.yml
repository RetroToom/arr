---
id: retrotoonworld
name: RetroToon World
description: "RetroToon World is a Private Torrent Tracker for CARTOONS / ANIME / ANIMATION"
language: en-US
type: private
encoding: UTF-8
followredirect: false
requestDelay: 2
links:
  - https://www.retrotoon.world/

caps:
  categorymappings:
    # id = RetroToon internal category id (torrents.category) -> Torznab category
    - {id: 1,  cat: TV,            desc: "Retro Cartoons"}
    - {id: 2,  cat: TV,            desc: "Modern Cartoons"}
    - {id: 3,  cat: Movies,        desc: "Animated Feature"}
    - {id: 4,  cat: TV/Anime,      desc: "Anime"}
    - {id: 5,  cat: TV/Anime,      desc: "OVA"}
    - {id: 6,  cat: TV,            desc: "Shorts"}
    - {id: 7,  cat: TV,            desc: "Indie"}
    - {id: 8,  cat: XXX,           desc: "Adult"}
    - {id: 9,  cat: TV,            desc: "CGI"}
    - {id: 10, cat: TV,            desc: "Clay"}
    - {id: 11, cat: Books/Comics,  desc: "Comics"}
    - {id: 12, cat: TV/Anime,      desc: "Manga"}
    - {id: 13, cat: TV,            desc: "Art"}
    - {id: 14, cat: Audio,         desc: "OST"}
    - {id: 15, cat: TV,            desc: "Ads"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tmdbid, tvdbid]
    movie-search: [q, imdbid, tmdbid]

settings:
  - name: apikey
    type: text
    label: Passkey (your torrent_pass / RSS key)
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: single_file_release_use_filename
    type: checkbox
    label: Use filename as title for single-file releases
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  # Connectivity/key test — a valid passkey returns 200 JSON, an invalid one 401.
  path: api/torrents/filter.php
  method: get
  inputs:
    api_token: "{{ .Config.apikey }}"
    perPage: 1

search:
  paths:
    - path: api/torrents/filter.php
      response:
        type: json

  inputs:
    $raw: "{{ range .Categories }}categories[]={{.}}&{{end}}"
    api_token: "{{ .Config.apikey }}"
    name: "{{ .Keywords }}"
    seasonNumber: "{{ .Query.Season }}"
    episodeNumber: "{{ .Query.Ep }}"
    imdbId: "{{ .Query.IMDBIDShort }}"
    tmdbId: "{{ .Query.TMDBID }}"
    tvdbId: "{{ .Query.TVDBID }}"
    "free[]": "{{ if .Config.freeleech }}100{{ else }}{{ end }}"
    sortField: "{{ .Config.sort }}"
    sortDirection: "{{ .Config.type }}"
    perPage: 100

  keywordsfilters:
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: data
    attribute: attributes

  fields:
    category:
      selector: category_id
    title_optional:
      selector: name
    title_filename:
      selector: "files[0].name"
      optional: true
    files:
      selector: num_file
    title:
      text: "{{ if and (.Config.single_file_release_use_filename) (eq .Result.files \"1\") (.Result.title_filename) }}{{ .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}"
    details:
      selector: details_link
    download:
      selector: download_link
    infohash:
      selector: info_hash
    poster:
      selector: meta.poster
    imdbid:
      selector: imdb_id
    tmdbid:
      selector: tmdb_id
    tvdbid:
      selector: tvdb_id
    genre:
      selector: meta.genres
      optional: true
    description:
      selector: meta.genres
      optional: true
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # reserializes it to "MM/dd/yyyy HH:mm:ss" before these filters run.
      selector: created_at
      filters:
        - name: append
          args: " +00:00"
        - name: dateparse
          args: "MM/dd/yyyy HH:mm:ss zzz"
    size:
      selector: size
    downloadvolumefactor:
      # api returns 0%, 25%, 50%, 75%, 100%
      selector: freeleech
      case:
        0%: 1
        25%: 0.75
        50%: 0.5
        75%: 0.25
        100%: 0
        "*": 1
    uploadvolumefactor:
      # RetroToon-specific field: exact factor (1, 2, 3, or 0 for Neutral)
      selector: upload_factor
    minimumseedtime:
      # 7 days
      text: 604800
# json-schema-version: v11
